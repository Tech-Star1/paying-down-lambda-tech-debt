AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  identity-service - mock estate on the end-of-support Python 3.10 runtime.
  Runtime debt declared here; nothing is deployed.

Globals:
  Function:
    # END-OF-SUPPORT: Python 3.10 reaches Lambda EOL Oct 31, 2026.
    Runtime: python3.10
    Timeout: 15
    MemorySize: 256

Resources:
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: login_handler.lambda_handler
      CodeUri: src/

  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: session_handler.lambda_handler
      CodeUri: src/

  TokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: token_handler.lambda_handler
      CodeUri: src/

  MfaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: mfa_handler.lambda_handler
      CodeUri: src/
