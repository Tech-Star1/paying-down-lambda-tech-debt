AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ledger-service - PCI-scoped mock estate on the end-of-support Python 3.10
  runtime. Runtime debt declared here; nothing is deployed. This domain is the
  one to modernize-as-you-migrate for a PCI lift-and-shift.

Globals:
  Function:
    # END-OF-SUPPORT: Python 3.10 reaches Lambda EOL Oct 31, 2026.
    Runtime: python3.10
    Timeout: 15
    MemorySize: 256
    Tags:
      Scope: PCI

Resources:
  PostingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: posting_handler.lambda_handler
      CodeUri: src/

  BalanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: balance_handler.lambda_handler
      CodeUri: src/

  AuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: audit_handler.lambda_handler
      CodeUri: src/

  StatementFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: statement_handler.lambda_handler
      CodeUri: src/
