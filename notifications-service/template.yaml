AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  notifications-service - mock estate on the end-of-support Python 3.10
  runtime. Runtime debt declared here; nothing is deployed.

Globals:
  Function:
    # END-OF-SUPPORT: Python 3.10 reaches Lambda EOL Oct 31, 2026.
    Runtime: python3.10
    Timeout: 15
    MemorySize: 256

Resources:
  EmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: email_handler.lambda_handler
      CodeUri: src/

  SmsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sms_handler.lambda_handler
      CodeUri: src/

  PushFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: push_handler.lambda_handler
      CodeUri: src/

  DigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: digest_handler.lambda_handler
      CodeUri: src/
